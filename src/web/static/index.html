<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f2"><meta name="description" content="拾物：一起发现好物，与好友聊选择，让客服咪帮你对比与总结。">
  <title>拾物 SHIWU · 好物，一起发现</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232a5546'/%3E%3Cpath d='M19 27h26l-3 22H22zM25 27v-5a7 7 0 0114 0v5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/platform.css">
  <script defer src="/static/platform.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="rail">
    <a class="brand" href="#shop" data-action="nav" data-view="shop" aria-label="拾物首页"><span class="brand-symbol">拾</span><span>拾物<small>SHIWU</small></span></a>
    <div class="rail-caption">好物，一起发现</div>
    <nav class="main-nav" aria-label="主导航">
      <button class="nav-item active" data-action="nav" data-view="shop"><span data-icon="store"></span>发现好物<span class="nav-dot"></span></button>
      <button class="nav-item" data-action="nav" data-view="messages"><span data-icon="chat"></span>我的消息<span id="unread-total" class="badge hidden">0</span></button>
      <button class="nav-item" data-action="nav" data-view="friends"><span data-icon="users"></span>好友与群组<span id="request-count" class="badge hidden">0</span></button>
    </nav>
    <div class="rail-separator"></div>
    <div class="rail-label">一起逛逛 <button class="icon-button" data-action="create-group" aria-label="创建群聊">＋</button></div>
    <div id="rail-chats" class="rail-chats"></div>
    <div class="rail-bottom">
      <div class="demo-note"><span class="status-light"></span>本地体验空间<span class="tag">DEMO</span><p>模拟商品与账号，用真实交互探索 AI 电商。</p></div>
      <button class="account-switch" data-action="accounts"><span id="my-avatar" class="avatar"></span><span><b id="my-name">正在连接</b><small>切换演示账号</small></span><span data-icon="switch"></span></button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>拾物生活</span><i>/</i><b id="page-name">发现好物</b></div>
      <form id="search-form" class="search-box" role="search"><span data-icon="search"></span><input id="global-search" placeholder="搜索商品、品牌或灵感" aria-label="搜索商品"><kbd>↵</kbd></form>
      <div class="top-actions"><span id="connection" class="connection"><i></i>连接中</span><button class="assistant-toggle" data-action="toggle-ai"><span data-icon="sparkles"></span>客服咪<span class="shortcut">AI</span></button></div>
    </header>
    <div class="work-body">
      <main id="main-content" class="main-content" tabindex="-1"><div class="loading-state">正在准备你的好物空间…</div></main>
      <aside id="assistant" class="assistant" aria-label="客服咪 AI 助手">
        <header class="assistant-header"><div class="ai-mark">✦</div><div><b>客服咪 <span class="tag mint">AI 助手</span></b><small>帮你选好物，也帮你聊明白</small></div><button class="icon-button" data-action="toggle-ai" aria-label="收起助手"><span data-icon="panel"></span></button></header>
        <div class="ai-context"><span data-icon="link"></span><span id="ai-context-label">当前范围：商城商品</span></div>
        <div class="ai-tabs"><button class="active" data-action="ai-tab" data-tab="chat">问商品</button><button data-action="ai-tab" data-tab="compare">商品对比</button><button data-action="ai-tab" data-tab="summary">聊天总结</button></div>
        <div id="ai-options" class="ai-options"></div>
        <div id="ai-messages" class="ai-messages" aria-live="polite"></div>
        <div id="ai-busy" class="ai-busy hidden"><span class="spinner"></span>正在整理数据依据…</div>
        <div class="ai-compose"><form id="ai-form"><textarea id="ai-input" rows="2" maxlength="2000" placeholder="告诉客服咪你的预算和需求…" aria-label="向客服咪提问"></textarea><div><small>仅分析当前选定的商品和聊天</small><button id="ai-send" class="round-button" type="submit" aria-label="发送 AI 问题"><span data-icon="arrow-up"></span></button></div></form><p id="ai-mode">本地数据工具 · 商品参数可核验</p></div>
      </aside>
    </div>
  </div>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-body"></div></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript>请启用 JavaScript 以使用模拟商城与聊天功能。</noscript>
</body></html>
